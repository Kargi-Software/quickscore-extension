<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>QuickScore</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app" dir="ltr">
    <header id="header">
      <span id="title">QuickScore</span>
      <div id="header-actions">
        <button id="refresh-btn" class="icon-btn" title="Refresh"></button>
        <button id="theme-btn" class="icon-btn" title="Toggle dark / light theme"></button>
        <button id="sidebar-btn" class="icon-btn hidden" title="Open in sidebar"></button>
        <button id="settings-btn" class="icon-btn" title="Settings"></button>
        <button id="close-btn" class="icon-btn" title="Close"></button>
      </div>
    </header>

    <div id="controls">
      <div id="sport-chips" role="tablist"></div>

      <div id="day-nav">
        <button id="day-prev" class="icon-btn nav-arrow" title="Previous day"></button>
        <span id="day-label" title="Click to pick a date">Today</span>
        <button id="day-next" class="icon-btn nav-arrow" title="Next day"></button>
        <button id="day-today" class="text-btn" title="Jump to today">Today</button>
      </div>
    </div>

    <div id="date-picker-panel" class="hidden">
      <div id="dp-header">
        <button id="dp-prev-month" class="icon-btn"></button>
        <span id="dp-month-label"></span>
        <button id="dp-next-month" class="icon-btn"></button>
      </div>
      <div id="dp-weekdays"></div>
      <div id="dp-grid"></div>
    </div>

    <div id="error-banner" class="hidden"></div>

    <div id="content">
      <div id="loading" class="hidden">Loading...</div>
      <div id="sections"></div>
      <div id="empty-state" class="hidden">No matches found.</div>
    </div>
  </div>

  <script src="../vendor/browser-polyfill.js"></script>
  <script src="../src/config.js"></script>
  <script src="../src/storage.js"></script>
  <script src="../src/leagues.js"></script>
  <script src="../src/time.js"></script>
  <script src="../src/utils.js"></script>
  <script src="../src/cache.js"></script>
  <script src="../src/icons.js"></script>
  <script src="../src/match-events.js"></script>
  <script src="../src/match-stats.js"></script>
  <script src="popup.js"></script>
</body>
</html>
